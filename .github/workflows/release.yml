name: Release Design Tokens

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tokens.json
      - web/**
      - ios/**
      - android/**
      - sources/icons/**
      - Package.swift

permissions:
  contents: write

concurrency:
  group: design-tokens-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Release all platforms and publish @101app/design-tokens-web
    runs-on: [self-hosted, Linux, X64, design-build]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve next version
        run: |
          LATEST_VERSION="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          if [ -z "$LATEST_VERSION" ]; then
            VERSION="1.0.0"
          else
            MAJOR="$(printf '%s' "$LATEST_VERSION" | cut -d. -f1)"
            MINOR="$(printf '%s' "$LATEST_VERSION" | cut -d. -f2)"
            PATCH="$(printf '%s' "$LATEST_VERSION" | cut -d. -f3)"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Git tag already exists: $VERSION"
            exit 1
          fi
          echo "Resolved release version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@101app"

      - name: Download verified Java 17
        run: |
          JAVA_ARCHIVE_URL="https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.21%2B9/OpenJDK17U-jdk_x64_linux_hotspot_17.0.21_9.tar.gz"
          JAVA_ARCHIVE_PATH="$HOME/tool-downloads/java17.tar.gz"
          mkdir -p "$HOME/tool-downloads"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 "$JAVA_ARCHIVE_URL.sha256.txt" --output "$RUNNER_TEMP/java17.sha256"
          JAVA_ARCHIVE_SHA="$(cut -d ' ' -f 1 "$RUNNER_TEMP/java17.sha256")"
          if ! printf '%s  %s\n' "$JAVA_ARCHIVE_SHA" "$JAVA_ARCHIVE_PATH" | sha256sum --check --status -; then
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 900 --continue-at - "$JAVA_ARCHIVE_URL" --output "$JAVA_ARCHIVE_PATH"
          fi
          if ! printf '%s  %s\n' "$JAVA_ARCHIVE_SHA" "$JAVA_ARCHIVE_PATH" | sha256sum --check -; then
            rm -f "$JAVA_ARCHIVE_PATH"
            exit 1
          fi
          printf 'JAVA_ARCHIVE_PATH=%s\n' "$JAVA_ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "jdkfile"
          java-version: "17.0.21"
          jdk-file: ${{ env.JAVA_ARCHIVE_PATH }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Check shared web typography
        run: node --test scripts/generate-web-typography.test.mjs

      - name: Check resource validator
        run: python3 scripts/test_validate_design_assets.py

      - name: Validate generated resources
        run: python3 scripts/validate_design_assets.py

      - name: Check platform files
        run: |
          test -f Package.swift
          test -f ios/Icons.swift
          test -f ios/Colors.swift
          test -f ios/Fonts.swift
          test -d ios/Icons.xcassets
          test -f android/build.gradle.kts
          test -f android/AndroidManifest.xml
          test -d android/res

      - name: Check web npm package contents
        env:
          DESIGN_TOKENS_PACKAGE_VERSION: ${{ env.VERSION }}
        run: npm run check:release

      - name: Check Android Gradle package
        env:
          DESIGN_TOKENS_PACKAGE_VERSION: ${{ env.VERSION }}
        run: gradle :android:publishToMavenLocal --no-daemon

      - name: Validate npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Missing GitHub Actions secret: NPM_TOKEN"
            exit 1
          fi
          npm whoami --registry "https://registry.npmjs.org"

      - name: Check web npm version
        run: |
          if npm view "@101app/design-tokens-web@$VERSION" version --registry "https://registry.npmjs.org" >/dev/null 2>&1; then
            echo "npm package version already exists: @101app/design-tokens-web@$VERSION"
            exit 1
          fi

      - name: Create Git tag for iOS and Android
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Publish web npm package
        env:
          DESIGN_TOKENS_PACKAGE_VERSION: ${{ env.VERSION }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm run release:design-tokens
